version: 2

updates:
  # npm workspaces resolve from the root lockfile, so `directory: /` covers
  # packages/core, packages/build/*, and packages/themes/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Fortnightly isn't a Dependabot interval and cron can't express "every
      # other Monday" (day-of-week steps silently run weekly), so this fires on
      # the 1st and 15th of each month instead.
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime deps of the published packages — these reach consumers, so
      # they stay out of the big dev-toolchain PR.
      runtime:
        patterns:
          - zod
          - luxon
          - markdown-it
          - markdown-it-anchor
          - simple-icons
          - beasties
          - purgecss
          - glob
          - html-minifier-terser
          - node-html-parser
        update-types: [minor, patch]
      # vitest and @vitest/* pin each other to an exact version, so a major
      # split across two PRs leaves each one failing npm ci on peer resolution.
      # No update-types filter: this has to cover majors too.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
      remaining-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors otherwise stay ungrouped so each arrives as its own reviewable PR.

    # Patch bumps are ignored outright. `update-types` rules apply to version
    # updates only, so Dependabot security updates still raise patch-level PRs.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      # Minors only, so an action major arrives as its own PR. release.yml runs
      # on push to main and never on a PR, so a grouped major merges green and
      # then fails on main — changesets/action v2 renamed every input this way
      # (#80, fixed in #84).
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: cron
      cronjob: '0 6 1,15 * *'
      timezone: Europe/London
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
