name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      # RELEASE_TOKEN, not the default GITHUB_TOKEN: the repo has "Allow GitHub
      # Actions to create and approve pull requests" off, and PRs opened with
      # GITHUB_TOKEN never trigger CI, so the version PR would merge unchecked.
      # It goes in the `github-token` input: v2 dropped the GITHUB_TOKEN env var.
      #
      # npm auth is Trusted Publishing (OIDC): the `id-token: write` permission
      # above lets npm verify this workflow's identity against the trusted
      # publisher registered on each package, so there is no NPM_TOKEN to leak.
      # Requires npm >= 11.5.1; .nvmrc pins Node 24, which ships npm 11.19.
      #
      # SHA-pinned: `changesets/action@v2` resolves to a mutable *branch*
      # (refs/heads/v2), not a tag — anything pushed there would run with
      # RELEASE_TOKEN and contents:write. Dependabot maintains this pin.
      - name: Create Release PR or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          publish-script: npm run release
          version-script: npm run version
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
